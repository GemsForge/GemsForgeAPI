name: Sync repository labels

# Runs on every default-branch push as well as weekly: GitHub disables
# schedules after 60 days without repository activity.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  labels:
    uses: GemsForge/.github/.github/workflows/sync-labels.yml@v1
