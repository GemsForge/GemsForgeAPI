name: Database validation

on:
  pull_request:
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/database-validation.yml'
  push:
    branches: [master]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/database-validation.yml'

permissions:
  contents: read

jobs:
  database-validation:
    name: ${{ matrix.environment }} database validation
    runs-on: macos-15
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, fit, prod]
    timeout-minutes: 30
    env:
      GEMLIFE_ENVIRONMENT: ${{ matrix.environment }}
      DATABASE_PATH: ${{ github.workspace }}/.ci/GemLife_DB_${{ matrix.environment }}.sqlite
      LIVE_DATABASE_BACKUP_DIRECTORY: ${{ github.workspace }}/.ci/database-backups/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare isolated database paths
        run: mkdir -p "$LIVE_DATABASE_BACKUP_DIRECTORY"
      - name: Report selected environment
        run: echo "Validating Gem Life environment: $GEMLIFE_ENVIRONMENT"
      - name: Run API and migration tests
        run: swift test --parallel
