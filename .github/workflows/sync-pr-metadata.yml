name: Sync issue and pull request metadata

on:
  issues:
    types: [opened, reopened, closed]
  pull_request:
    types: [opened, reopened, edited, ready_for_review, closed]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Working issue number
        required: true
        type: number
      qa_acceptance:
        description: Authorize QA acceptance and close the issue
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number || '' }}
          QA_ACCEPTANCE: ${{ inputs.qa_acceptance || 'false' }}
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const fullName = owner + "/" + repo;
            const projectNumbers = {
              "GemsForge/GemsForgeAPI": 7,
              "GemsForge/aura-logbook-api": 9,
              "GemsForge/professional-portfolio": 8,
            };
            const projectNumber = projectNumbers[fullName];
            if (!projectNumber) throw new Error("No Project mapping configured for " + fullName);
            const issueFromRef = (ref) => Number((ref || "").match(
              /^(?:feat|fix|docs|refactor|test|chore|ci|build|perf|style)\/(\d+)(?:-|$)/i
            )?.[1]) || undefined;
            const closingIssues = (body) => [...new Set([...((body || "").matchAll(
              /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?):?\s+#([1-9]\d*)\b/gi
            ))].map((m) => Number(m[1])))];
            const inputIssue = Number(process.env.ISSUE_NUMBER) || undefined;
            const pr = context.payload.pull_request;
            const issueNumber = context.payload.issue?.number ||
              inputIssue || issueFromRef(pr?.head?.ref) || closingIssues(pr?.body)[0];
            if (!issueNumber) throw new Error("Unable to resolve a working issue.");
            const issue = (await github.rest.issues.get({
              ...context.repo, issue_number: issueNumber
            })).data;
            const reviewState = context.eventName === "pull_request_review"
              ? (context.payload.review?.state || "").toLowerCase() : "";
            if (process.env.QA_ACCEPTANCE === "true") {
              if (context.actor !== "GemsForge") {
                throw new Error("Only the GemsForge account may authorize QA acceptance.");
              }
              await github.rest.issues.update({
                ...context.repo, issue_number: issueNumber,
                state: "closed", state_reason: "completed"
              });
            }
            const token = process.env.PROJECTS_TOKEN;
            if (!token) throw new Error("PROJECTS_TOKEN is required.");
            const gql = async (query, variables) => {
              const response = await fetch("https://api.github.com/graphql", {
                method: "POST",
                headers: {
                  accept: "application/vnd.github+json",
                  authorization: "Bearer " + token,
                  "content-type": "application/json",
                  "x-github-api-version": "2022-11-28"
                },
                body: JSON.stringify({ query, variables })
              });
              const body = await response.json();
              if (!response.ok || body.errors?.length) {
                throw new Error(JSON.stringify(body.errors || body));
              }
              return body.data;
            };
            const projectData = await gql(
              "query($login:String!){organization(login:$login){projectsV2(first:100){nodes{id number title}}}}",
              { login: "GemsForge-LLC" }
            );
            const project = (projectData.organization?.projectsV2?.nodes || [])
              .find((p) => p.number === projectNumber);
            if (!project) throw new Error("GemsForge Project #" + projectNumber + " was not found.");
            const fieldsData = await gql(
              "query($id:ID!){node(id:$id){... on ProjectV2{fields(first:100){nodes{... on ProjectV2SingleSelectField{id name options{id name}}}}}}}",
              { id: project.id }
            );
            const statusField = (fieldsData.node?.fields?.nodes || [])
              .find((f) => f.name === "Status");
            if (!statusField) throw new Error("Project Status field is missing.");
            const status = (name) => {
              const found = statusField.options.find((o) => o.name.toLowerCase() === name.toLowerCase());
              if (!found) throw new Error("Missing Project Status option: " + name);
              return found.id;
            };
            const addItem = async (nodeId) => {
              const data = await gql(
                "mutation($p:ID!,$c:ID!){addProjectV2ItemById(input:{projectId:$p,contentId:$c}){item{id}}}",
                { p: project.id, c: nodeId }
              );
              return data.addProjectV2ItemById.item.id;
            };
            const itemsData = await gql(
              "query($id:ID!){node(id:$id){... on ProjectV2{items(first:100){nodes{id content{__typename ... on Issue{number repository{nameWithOwner}} ... on PullRequest{number repository{nameWithOwner}}}}}}}}",
              { id: project.id }
            );
            const items = itemsData.node?.items?.nodes || [];
            const findItem = (kind, number) => items.find((i) =>
              i.content?.__typename === kind &&
              i.content.number === number &&
              i.content.repository?.nameWithOwner === fullName
            );
            const issueItem = findItem("Issue", issueNumber) || await addItem(issue.node_id);
            const setStatus = async (itemId, name) => {
              await gql(
                "mutation($p:ID!,$i:ID!,$f:ID!,$o:String!){updateProjectV2ItemFieldValue(input:{projectId:$p,itemId:$i,fieldId:$f,value:{singleSelectOptionId:$o}}){projectV2Item{id}}}",
                { p: project.id, i: itemId, f: statusField.id, o: status(name) }
              );
            };
            let desired = "Backlog";
            if (issue.state === "closed") desired = "Done";
            else if (pr?.merged) desired = "QA";
            else if (reviewState === "changes_requested") desired = "Changes requested";
            else if (pr?.draft) desired = "In progress";
            else if (pr || context.eventName === "pull_request_review") desired = "In review";
            else {
              const branches = await github.paginate(github.rest.repos.listBranches, {...context.repo, per_page:100});
              desired = branches.some((b) => issueFromRef(b.name) === issueNumber) ? "In progress" : "Backlog";
            }
            await setStatus(issueItem, desired);
            if (pr) {
              const prItem = findItem("PullRequest", pr.number) || await addItem(pr.node_id);
              await setStatus(prItem, pr.merged ? "QA" : pr.state === "closed" ? "Done" : desired);
            }
            core.notice("Issue #" + issueNumber + " synchronized to " + desired + " in Project #" + projectNumber + ".");
