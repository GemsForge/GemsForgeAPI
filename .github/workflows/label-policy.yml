name: Story label policy

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  label-policy:
    name: Require type-compatible story label
    runs-on: ubuntu-latest
    steps:
      - name: Validate title and required label
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title || "";
            const match = /^(feat|fix|refactor|test|docs|chore|ci)\(([a-z0-9-]+)\): #[1-9][0-9]* [a-z][a-z0-9-]*(?:\s+\S.*)?$/.exec(title);
            if (!match) {
              core.setFailed("PR title must match type(scope): #issue short imperative description.");
              return;
            }
            const required = {
              feat: "feature",
              fix: "fix",
              refactor: "refactor",
              test: "testing",
              docs: "documentation",
              chore: "chore",
              ci: "ci",
            }[match[1]];
            const labels = (pr.labels || []).map(({ name }) => name);
            if (!labels.includes(required)) {
              core.setFailed(`Missing required label: ${required}.`);
              return;
            }
            core.notice(`Label policy passed: ${required}.`);
